# Game Day Scoreboard page (LVGL). Adapted from hub75-studio's Team Tracker
# Live page (MIT, Stuart Parmenter). One file for every panel arrangement: on
# a 64-wide display it stacks logos over scores; at 128 wide and up it spreads
# logos to the edges with big scores, records, and timeout pips in the middle.
# The gameday component feeds it through the gd_update script; logos are
# online_image widgets declared in gameday-common.yaml.

lvgl_page_manager:
  pages:
    - page: gameday_live
      friendly_name: "Scoreboard"

esphome:
  on_boot:
    - priority: -100.0
      then:
        - lambda: |-
            id(shared_scroll_speed).add_on_state_callback([](float sp) {
              const char *cur = lv_label_get_text(id(tt_game_status_lbl));
              size_t len = cur ? strlen(cur) : 0;
              uint32_t per = (uint32_t) (280 - sp * 26);
              uint32_t anim_ms = (uint32_t) (len * per);
              if (anim_ms < 3000) anim_ms = 3000;
              lv_obj_set_style_anim_time(id(tt_game_status_lbl), anim_ms, LV_PART_MAIN);
              lv_label_set_long_mode(id(tt_game_status_lbl), LV_LABEL_LONG_CLIP);
              lv_label_set_long_mode(id(tt_game_status_lbl), LV_LABEL_LONG_SCROLL_CIRCULAR);
            });

script:
  - id: tt_hide_splash
    mode: restart
    then:
      - delay: 4s
      - lambda: 'lv_obj_add_flag(id(tt_splash), LV_OBJ_FLAG_HIDDEN);'

  - id: tt_apply_layout
    then:
      - lambda: |-
          // Measure the display and lay the scoreboard out to fit it.
          // Everything is positioned here rather than in the widget config so
          // one page file serves 64x64, 128x64, and wider chains alike.
          const int W = lv_disp_get_hor_res(lv_disp_get_default());
          const bool wide = W >= 128;
          lv_obj_set_size(id(tt_game_container), W, 64);
          lv_obj_set_size(id(tt_no_game_container), W, 64);
          lv_obj_set_size(id(tt_splash), W, 64);
          lv_obj_set_width(id(tt_splash_lbl), W);
          lv_obj_set_width(id(tt_no_game_msg_lbl), W);
          lv_obj_set_width(id(tt_game_status_lbl), W);
          lv_obj_t *abars[3] = {id(tt_away_to1), id(tt_away_to2), id(tt_away_to3)};
          lv_obj_t *hbars[3] = {id(tt_home_to1), id(tt_home_to2), id(tt_home_to3)};
          if (wide) {
            // Logos at the far edges, score columns in the middle
            const int colw = W / 2 - 36;
            lv_obj_set_pos(id(gd_team_logo_img), 2, 4);
            lv_obj_set_pos(id(gd_opp_logo_img), W - 34, 4);
            lv_obj_set_style_text_font(id(tt_away_team_lbl), id(spleen_12), 0);
            lv_obj_set_style_text_font(id(tt_home_team_lbl), id(spleen_12), 0);
            lv_obj_set_style_text_font(id(tt_away_score_lbl), id(spleen_16), 0);
            lv_obj_set_style_text_font(id(tt_home_score_lbl), id(spleen_16), 0);
            lv_obj_set_pos(id(tt_away_team_lbl), 36, 4);
            lv_obj_set_width(id(tt_away_team_lbl), colw);
            lv_obj_set_pos(id(tt_home_team_lbl), W / 2, 4);
            lv_obj_set_width(id(tt_home_team_lbl), colw);
            lv_obj_set_pos(id(tt_away_score_lbl), 36, 18);
            lv_obj_set_width(id(tt_away_score_lbl), colw);
            lv_obj_set_pos(id(tt_home_score_lbl), W / 2, 18);
            lv_obj_set_width(id(tt_home_score_lbl), colw);
            // Records sit under each logo so they stay visible during the game
            lv_obj_set_style_text_font(id(tt_away_rec_lbl), id(spleen_8), 0);
            lv_obj_set_style_text_font(id(tt_home_rec_lbl), id(spleen_8), 0);
            lv_obj_set_pos(id(tt_away_rec_lbl), 0, 38);
            lv_obj_set_width(id(tt_away_rec_lbl), 36);
            lv_obj_set_pos(id(tt_home_rec_lbl), W - 36, 38);
            lv_obj_set_width(id(tt_home_rec_lbl), 36);
            // Down and distance under the clock, in the middle
            lv_obj_set_pos(id(tt_down_lbl), 36, 48);
            lv_obj_set_width(id(tt_down_lbl), W - 72);
            // Game clock takes the records row while the game is live
            lv_obj_set_style_text_font(id(tt_clock_lbl), id(spleen_12), 0);
            lv_obj_set_pos(id(tt_clock_lbl), 36, 35);
            lv_obj_set_width(id(tt_clock_lbl), W - 72);
            // Timeout pips centered under each logo
            const int acx = 18, hcx = W - 18;
            for (int i = 0; i < 3; i++) {
              lv_obj_clear_flag(abars[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(hbars[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_pos(abars[i], acx - 9 + i * 7, 48);
              lv_obj_set_pos(hbars[i], hcx - 9 + i * 7, 48);
            }
            lv_obj_set_pos(id(tt_game_status_lbl), 0, 56);
            lv_obj_set_style_text_font(id(tt_splash_lbl), id(spleen_16), 0);
            lv_obj_set_pos(id(tt_splash_lbl), 0, 16);
          } else {
            // Single panel: logos side by side, everything stacked beneath
            lv_obj_set_pos(id(gd_team_logo_img), 0, 0);
            lv_obj_set_pos(id(gd_opp_logo_img), W - 32, 0);
            lv_obj_set_style_text_font(id(tt_away_team_lbl), id(spleen_8), 0);
            lv_obj_set_style_text_font(id(tt_home_team_lbl), id(spleen_8), 0);
            lv_obj_set_style_text_font(id(tt_away_score_lbl), id(spleen_12), 0);
            lv_obj_set_style_text_font(id(tt_home_score_lbl), id(spleen_12), 0);
            lv_obj_set_pos(id(tt_away_team_lbl), 0, 33);
            lv_obj_set_width(id(tt_away_team_lbl), W / 2);
            lv_obj_set_pos(id(tt_home_team_lbl), W / 2, 33);
            lv_obj_set_width(id(tt_home_team_lbl), W / 2);
            // Game clock replaces the abbreviations while the game is live
            lv_obj_set_style_text_font(id(tt_clock_lbl), id(spleen_8), 0);
            lv_obj_set_pos(id(tt_clock_lbl), 0, 33);
            lv_obj_set_width(id(tt_clock_lbl), W);
            lv_obj_set_pos(id(tt_away_score_lbl), 0, 42);
            lv_obj_set_width(id(tt_away_score_lbl), W / 2);
            lv_obj_set_pos(id(tt_home_score_lbl), W / 2, 42);
            lv_obj_set_width(id(tt_home_score_lbl), W / 2);
            lv_obj_add_flag(id(tt_down_lbl), LV_OBJ_FLAG_HIDDEN);
            // No room for records or pips on a single panel
            lv_obj_add_flag(id(tt_away_rec_lbl), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(tt_home_rec_lbl), LV_OBJ_FLAG_HIDDEN);
            for (int i = 0; i < 3; i++) {
              lv_obj_add_flag(abars[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(hbars[i], LV_OBJ_FLAG_HIDDEN);
            }
            lv_obj_set_pos(id(tt_game_status_lbl), 0, 56);
            lv_obj_set_style_text_font(id(tt_splash_lbl), id(spleen_12), 0);
            lv_obj_set_pos(id(tt_splash_lbl), 0, 18);
          }

  - id: gd_update
    parameters:
      game_state: string
      team_abbr: string
      team_score: int
      opponent_abbr: string
      opponent_score: int
      status_text: string
      clock_text: string
      down_distance: string
      is_red_zone: bool
      team_color: int
      opponent_color: int
      possession: int
      team_timeouts: int
      opponent_timeouts: int
      team_record: string
      opponent_record: string
      splash_text: string
      splash_color: int
    then:
      - lvgl.label.update:
          id: tt_away_team_lbl
          text: !lambda 'return team_abbr;'
      - lvgl.label.update:
          id: tt_away_score_lbl
          text: !lambda 'return to_string(team_score);'
      - lvgl.label.update:
          id: tt_home_team_lbl
          text: !lambda 'return opponent_abbr;'
      - lvgl.label.update:
          id: tt_home_score_lbl
          text: !lambda 'return to_string(opponent_score);'
      - lvgl.label.update:
          id: tt_away_rec_lbl
          text: !lambda 'return team_record;'
      - lvgl.label.update:
          id: tt_home_rec_lbl
          text: !lambda 'return opponent_record;'
      - lambda: |-
          // Update the ticker only when its text changed: rewriting the label
          // restarts the scroll animation, and pushes arrive every few seconds.
          // Scale the animation time with the text length so the scroll speed
          // stays constant (LVGL animates over a fixed TIME, not a fixed speed).
          const char *cur = lv_label_get_text(id(tt_game_status_lbl));
          if (cur == nullptr || status_text != cur) {
            lv_label_set_text(id(tt_game_status_lbl), status_text.c_str());
            float sp = id(shared_scroll_speed).has_state() ? id(shared_scroll_speed).state : 5.0f;
            uint32_t per = (uint32_t) (280 - sp * 26);
            uint32_t anim_ms = (uint32_t) (status_text.length() * per);
            if (anim_ms < 3000) anim_ms = 3000;
            lv_obj_set_style_anim_time(id(tt_game_status_lbl), anim_ms, LV_PART_MAIN);
          }
      - lambda: |-
          // Timeout pips: lit bar = timeout remaining, dim bar = used
          int a = team_timeouts < 0 ? 0 : (team_timeouts > 3 ? 3 : team_timeouts);
          int h = opponent_timeouts < 0 ? 0 : (opponent_timeouts > 3 ? 3 : opponent_timeouts);
          lv_obj_t *abars[3] = {id(tt_away_to1), id(tt_away_to2), id(tt_away_to3)};
          lv_obj_t *hbars[3] = {id(tt_home_to1), id(tt_home_to2), id(tt_home_to3)};
          for (int i = 0; i < 3; i++) {
            lv_obj_set_style_bg_color(abars[i], i < a ? lv_color_hex(0xFFD000) : lv_color_hex(0x202020), 0);
            lv_obj_set_style_bg_color(hbars[i], i < h ? lv_color_hex(0xFFD000) : lv_color_hex(0x202020), 0);
          }
      - lambda: |-
          // Abbreviations in team colors; the team with the ball turns gold.
          // Dark team colors vanish on the panel, so lift them to full brightness.
          auto bright = [](uint32_t c) -> lv_color_t {
            uint32_t r = (c >> 16) & 0xFF, g = (c >> 8) & 0xFF, b = c & 0xFF;
            uint32_t m = std::max(r, std::max(g, b));
            if (m == 0)
              return lv_color_hex(0xFFFFFF);
            if (m < 0xC0) {
              r = r * 0xC0 / m;
              g = g * 0xC0 / m;
              b = b * 0xC0 / m;
            }
            return lv_color_make(r, g, b);
          };
          lv_color_t active = lv_color_hex(0xFFD000);
          lv_color_t idle = lv_color_hex(0xFFFFFF);
          lv_obj_set_style_text_color(id(tt_away_team_lbl), possession == 1 ? active : bright((uint32_t) team_color), 0);
          lv_obj_set_style_text_color(id(tt_home_team_lbl), possession == 2 ? active : bright((uint32_t) opponent_color), 0);
          // Narrow displays hide the abbreviations during the game, so the
          // scores carry the possession color there.
          const bool narrow = lv_disp_get_hor_res(lv_disp_get_default()) < 128;
          lv_obj_set_style_text_color(id(tt_away_score_lbl), (narrow && possession == 1) ? active : idle, 0);
          lv_obj_set_style_text_color(id(tt_home_score_lbl), (narrow && possession == 2) ? active : idle, 0);
      - lambda: |-
          // Toggle between the game layout and the "no game" layout
          if (game_state == "NOT_FOUND" || game_state == "BYE" || game_state == "") {
            lv_obj_add_flag(id(tt_game_container), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(tt_no_game_container), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_clear_flag(id(tt_game_container), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(tt_no_game_container), LV_OBJ_FLAG_HIDDEN);
          }
          // Records are pre/post-game info; hide them while the game is live
          // (the layout also hides them entirely on narrow displays).
          const int W = lv_disp_get_hor_res(lv_disp_get_default());
          if (W < 128) {
            lv_obj_add_flag(id(tt_away_rec_lbl), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(tt_home_rec_lbl), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_clear_flag(id(tt_away_rec_lbl), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(tt_home_rec_lbl), LV_OBJ_FLAG_HIDDEN);
          }
          // Down and distance under the clock while live; red in the red zone
          if (W >= 128 && game_state == "IN" && !down_distance.empty()) {
            lv_label_set_text(id(tt_down_lbl), down_distance.c_str());
            lv_obj_set_style_text_color(id(tt_down_lbl), is_red_zone ? lv_color_hex(0xFF3030) : lv_color_hex(0xFFFFFF), 0);
            lv_obj_clear_flag(id(tt_down_lbl), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(tt_down_lbl), LV_OBJ_FLAG_HIDDEN);
          }
          // Big game clock while live: its own row on wide displays, the
          // abbreviation row on a single panel (the logos still say who is who).
          const bool show_clock = game_state == "IN" && !clock_text.empty();
          if (show_clock) {
            lv_label_set_text(id(tt_clock_lbl), clock_text.c_str());
            lv_obj_clear_flag(id(tt_clock_lbl), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(tt_clock_lbl), LV_OBJ_FLAG_HIDDEN);
          }
          if (W < 128 && show_clock) {
            lv_obj_add_flag(id(tt_away_team_lbl), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(tt_home_team_lbl), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_clear_flag(id(tt_away_team_lbl), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(tt_home_team_lbl), LV_OBJ_FLAG_HIDDEN);
          }
      - if:
          condition:
            lambda: 'return !splash_text.empty();'
          then:
            - lambda: |-
                lv_label_set_text(id(tt_splash_lbl), splash_text.c_str());
                lv_obj_set_style_bg_color(id(tt_splash), lv_color_hex((uint32_t) splash_color), 0);
                lv_obj_clear_flag(id(tt_splash), LV_OBJ_FLAG_HIDDEN);
            - script.execute: tt_hide_splash

lvgl:
  style_definitions:
    - id: tt_st_team_text
      text_opa: 90%
    - id: tt_st_score_text
      text_opa: 100%
    - id: tt_st_status_text
      text_opa: 75%

  pages:
    - id: gameday_live
      bg_color: 0x000000
      widgets:
        # Container for normal game display. All positions and fonts are
        # applied at runtime by tt_apply_layout; the values here are placeholders.
        - obj:
            id: tt_game_container
            x: 0
            y: 0
            width: 64
            height: 64
            widgets:
              - image:
                  id: gd_team_logo_img
                  src: gd_team_logo
                  x: 0
                  y: 0

              - image:
                  id: gd_opp_logo_img
                  src: gd_opp_logo
                  x: 32
                  y: 0

              - label:
                  id: tt_away_team_lbl
                  x: 0
                  y: 33
                  width: 32
                  text_align: CENTER
                  text: "----"
                  styles: ["tt_st_team_text"]

              - label:
                  id: tt_home_team_lbl
                  x: 32
                  y: 33
                  width: 32
                  text_align: CENTER
                  text: "----"
                  styles: ["tt_st_team_text"]

              - label:
                  id: tt_away_score_lbl
                  x: 0
                  y: 42
                  width: 32
                  text_align: CENTER
                  text: "-"
                  styles: ["tt_st_score_text"]

              - label:
                  id: tt_home_score_lbl
                  x: 32
                  y: 42
                  width: 32
                  text_align: CENTER
                  text: "-"
                  styles: ["tt_st_score_text"]

              - label:
                  id: tt_clock_lbl
                  x: 0
                  y: 33
                  width: 64
                  text_align: CENTER
                  hidden: true
                  text: ""
                  styles: ["tt_st_score_text"]

              - label:
                  id: tt_down_lbl
                  x: 0
                  y: 48
                  width: 64
                  text_align: CENTER
                  hidden: true
                  text: ""
                  styles: ["tt_st_status_text"]

              - label:
                  id: tt_away_rec_lbl
                  x: 0
                  y: 36
                  width: 32
                  text_align: CENTER
                  text: ""
                  styles: ["tt_st_status_text"]

              - label:
                  id: tt_home_rec_lbl
                  x: 32
                  y: 36
                  width: 32
                  text_align: CENTER
                  text: ""
                  styles: ["tt_st_status_text"]

              - obj:
                  id: tt_away_to1
                  x: 0
                  y: 46
                  width: 5
                  height: 3
                  bg_opa: COVER
                  bg_color: 0x202020
              - obj:
                  id: tt_away_to2
                  x: 7
                  y: 46
                  width: 5
                  height: 3
                  bg_opa: COVER
                  bg_color: 0x202020
              - obj:
                  id: tt_away_to3
                  x: 14
                  y: 46
                  width: 5
                  height: 3
                  bg_opa: COVER
                  bg_color: 0x202020
              - obj:
                  id: tt_home_to1
                  x: 44
                  y: 46
                  width: 5
                  height: 3
                  bg_opa: COVER
                  bg_color: 0x202020
              - obj:
                  id: tt_home_to2
                  x: 51
                  y: 46
                  width: 5
                  height: 3
                  bg_opa: COVER
                  bg_color: 0x202020
              - obj:
                  id: tt_home_to3
                  x: 58
                  y: 46
                  width: 5
                  height: 3
                  bg_opa: COVER
                  bg_color: 0x202020

              - label:
                  id: tt_game_status_lbl
                  x: 0
                  y: 55
                  width: 64
                  text_align: CENTER
                  long_mode: SCROLL_CIRCULAR
                  text: "Loading"
                  styles: ["tt_st_status_text"]

        # Full-screen score splash (TOUCHDOWN! etc), shown briefly on scores
        - obj:
            id: tt_splash
            x: 0
            y: 0
            width: 64
            height: 64
            hidden: true
            bg_opa: COVER
            bg_color: 0x000000
            widgets:
              - label:
                  id: tt_splash_lbl
                  x: 0
                  y: 16
                  width: 64
                  text_align: CENTER
                  long_mode: WRAP
                  text: ""
                  styles: ["tt_st_score_text"]

        # Container for "no game" display
        - obj:
            id: tt_no_game_container
            x: 0
            y: 0
            width: 64
            height: 64
            hidden: true
            widgets:
              - label:
                  id: tt_no_game_msg_lbl
                  x: 0
                  y: 26
                  width: 64
                  text_align: CENTER
                  long_mode: WRAP
                  text: "No upcoming game"
                  styles: ["tt_st_team_text"]

      on_load:
        then:
          - script.execute: tt_apply_layout
