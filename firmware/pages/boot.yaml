# Boot overlay for a standalone device. hub75-studio's bios page waits for a
# Home Assistant API connection before it clears; this one clears once WiFi
# is up and the clock has synced, which is all the scoreboard needs.

wifi:
  on_connect:
    then:
      - lvgl.label.update:
          id: boot_status
          text: "WiFi OK"

time:
  - id: !extend ha_time
    on_time_sync:
      then:
        - component.suspend: boot_check
        - lvgl.label.update:
            id: boot_status
            text: "*Ready*"
        - delay: 1500ms
        - lvgl.obj.update:
            id: boot_overlay
            hidden: true

interval:
  - interval: 500ms
    startup_delay: 1s
    id: boot_check
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lvgl.label.update:
                id: boot_status
                text: "Clock."
          else:
            - lvgl.label.update:
                id: boot_status
                text: "WiFi."

lvgl:
  top_layer:
    widgets:
      - obj:
          id: boot_overlay
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          styles: [style_bg_black]
          hidden: false
          widgets:
            - label:
                x: 2
                y: 2
                styles: [st_spleen8]
                text: "GAME DAY"
            - label:
                x: 2
                y: 12
                styles: [st_spleen8]
                text: "v${version}"
            - label:
                x: 2
                y: 22
                styles: [st_spleen8]
                text: !lambda |-
                  uint8_t mac[6] = {0};
                  get_mac_address_raw(mac);
                  char buf[32];
                  snprintf(buf, sizeof(buf), "ID:%02X%02X%02X", mac[3], mac[4], mac[5]);
                  return std::string(buf);
            - label:
                x: 2
                y: 32
                styles: [st_spleen8]
                text: "Setup: join WiFi"
            - label:
                x: 2
                y: 42
                styles: [st_spleen8]
                text: "Game Day Scoreboard"
            - label:
                id: boot_status
                align: TOP_MID
                y: 54
                styles: [st_spleen8]
                text: "Starting"
