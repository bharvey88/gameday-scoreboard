# Boot and setup screen. Shown over everything until the panel is on WiFi
# and has displayed its address for a while; the boot button brings it back.
#
# Three states, driven by the real WiFi state every half second. Each is a
# title plus up to four lines: small, big, small, small.
#
#   hotspot up     On your phone, join WiFi / Game Day Scoreboard / a setup page will open
#   connecting     Connecting to / <network name>
#   connected      On your phone, open / gameday.local / or 10.10.10.97 / then pick your team

globals:
  - id: boot_ip_shown_ms
    type: uint32_t
    initial_value: '0'
  - id: boot_bar_value
    type: int
    initial_value: '0'

script:
  # Positions and fonts for the current panel width
  - id: boot_layout
    then:
      - lambda: |-
          const int W = lv_disp_get_hor_res(lv_disp_get_default());
          const bool wide = W >= 128;
          lv_obj_t *lines[4] = {id(boot_la), id(boot_lb), id(boot_lc), id(boot_ld)};
          for (auto *l : lines) {
            lv_obj_set_width(l, W - 4);
            lv_obj_set_x(l, 2);
          }
          lv_obj_set_width(id(boot_title), W);
          lv_obj_set_width(id(boot_rule), W - 8);
          lv_obj_set_width(id(boot_bar), W - 16);
          lv_obj_set_pos(id(boot_bar), 8, wide ? 60 : 59);
          if (wide) {
            lv_obj_set_style_text_font(id(boot_title), id(spleen_16), 0);
            lv_obj_set_pos(id(boot_title), 0, 2);
            lv_obj_set_pos(id(boot_rule), 4, 19);
            lv_obj_set_style_text_font(id(boot_lb), id(spleen_12), 0);
            lv_obj_set_y(id(boot_la), 22);
            lv_obj_set_y(id(boot_lb), 31);
            lv_obj_set_y(id(boot_lc), 44);
            lv_obj_set_y(id(boot_ld), 53);
          } else {
            lv_obj_set_style_text_font(id(boot_title), id(spleen_12), 0);
            lv_obj_set_pos(id(boot_title), 0, 1);
            lv_obj_set_pos(id(boot_rule), 4, 14);
            lv_obj_set_style_text_font(id(boot_lb), id(spleen_8), 0);
            lv_obj_set_y(id(boot_la), 16);
            lv_obj_set_y(id(boot_lb), 26);
            lv_obj_set_y(id(boot_lc), 36);
            lv_obj_set_y(id(boot_ld), 46);
          }

  # Write the four lines. A line wider than the panel scrolls.
  - id: boot_set_lines
    parameters:
      la: string
      lb: string
      lc: string
      ld: string
      busy: bool
    then:
      - lambda: |-
          auto put = [](lv_obj_t *l, const std::string &t) {
            const char *cur = lv_label_get_text(l);
            if (cur == nullptr || t != cur)
              lv_label_set_text(l, t.c_str());
          };
          put(id(boot_la), la);
          put(id(boot_lb), lb);
          put(id(boot_lc), lc);
          put(id(boot_ld), ld);
          if (busy) lv_obj_clear_flag(id(boot_bar), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(boot_bar), LV_OBJ_FLAG_HIDDEN);

  - id: boot_refresh
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (w == nullptr) return;
          if (w->is_connected()) {
            std::string ip;
            for (auto &a : w->wifi_sta_ip_addresses()) {
              if (a.is_set() && a.is_ip4()) {
                char buf[48];
                a.str_to(buf);
                ip = buf;
                break;
              }
            }
            id(boot_set_lines).execute("On your phone, open", "${name}.local", "or " + ip, "then pick your team", false);
            if (id(boot_ip_shown_ms) == 0) {
              id(boot_ip_shown_ms) = millis() == 0 ? 1 : millis();
              id(boot_hide_later).execute();
            }
          } else if (!w->has_sta() || w->is_ap_active()) {
            id(boot_set_lines).execute("On your phone, join WiFi", "Game Day Scoreboard", "a setup page will open", "", true);
          } else {
            id(boot_set_lines).execute("Connecting to", w->wifi_ssid(), "", "", true);
          }

  # Keep the address up for 45 seconds after connecting, then clear the overlay
  - id: boot_hide_later
    mode: restart
    then:
      - delay: 45s
      - script.execute: boot_hide

  - id: boot_hide
    then:
      - component.suspend: boot_check
      - component.suspend: boot_anim
      - lvgl.obj.update:
          id: boot_overlay
          hidden: true

  # Preview: play the three setup states on the panel without touching WiFi
  - id: boot_preview
    mode: restart
    then:
      - component.suspend: boot_check
      - component.resume: boot_anim
      - lvgl.obj.update:
          id: boot_overlay
          hidden: false
      - script.execute:
          id: boot_set_lines
          la: "On your phone, join WiFi"
          lb: "Game Day Scoreboard"
          lc: "a setup page will open"
          ld: ""
          busy: true
      - delay: 7s
      - script.execute:
          id: boot_set_lines
          la: "Connecting to"
          lb: !lambda 'return wifi::global_wifi_component->wifi_ssid();'
          lc: ""
          ld: ""
          busy: true
      - delay: 5s
      - script.execute: boot_refresh
      - delay: 10s
      - script.execute: boot_hide

  # Boot button: bring the address back for 20 seconds
  - id: boot_show_address
    mode: restart
    then:
      - script.execute: boot_refresh
      - lvgl.obj.update:
          id: boot_overlay
          hidden: false
      - delay: 20s
      - script.execute: boot_hide

button:
  - platform: template
    name: "Preview Setup Screen"
    id: boot_preview_button
    icon: "mdi:monitor-eye"
    entity_category: config
    on_press:
      - script.execute: boot_preview

interval:
  - interval: 500ms
    startup_delay: 500ms
    id: boot_check
    then:
      - script.execute: boot_refresh
  - interval: 60ms
    id: boot_anim
    then:
      - lambda: |-
          id(boot_bar_value) = (id(boot_bar_value) + 3) % 130;
          int v = id(boot_bar_value) > 100 ? 100 : id(boot_bar_value);
          lv_bar_set_value(id(boot_bar), v, LV_ANIM_OFF);

binary_sensor:
  - id: !extend power_button
    on_multi_click:
      - timing:
          - ON for at least 1.5s
        then:
          - script.execute: boot_show_address

lvgl:
  style_definitions:
    - id: boot_st_title
      text_font: spleen_16
      text_color: 0xFFD000
    - id: boot_st_big
      text_color: 0xFFFFFF
    - id: boot_st_small
      text_color: 0xB0B8C4
  top_layer:
    widgets:
      - obj:
          id: boot_overlay
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: COVER
          bg_color: 0x000000
          radius: 0
          pad_all: 0
          border_width: 0
          hidden: false
          widgets:
            - label:
                id: boot_title
                x: 0
                y: 2
                width: 128
                text_align: CENTER
                text: "GAME DAY"
                styles: [boot_st_title]
            - obj:
                id: boot_rule
                x: 4
                y: 19
                width: 120
                height: 1
                bg_opa: COVER
                bg_color: 0xFFD000
            - label:
                id: boot_la
                x: 2
                y: 22
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: "Starting"
                styles: [boot_st_small]
            - label:
                id: boot_lb
                x: 2
                y: 31
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: ""
                styles: [boot_st_big]
            - label:
                id: boot_lc
                x: 2
                y: 44
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: ""
                styles: [boot_st_small]
            - label:
                id: boot_ld
                x: 2
                y: 53
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: ""
                styles: [boot_st_small]
            - bar:
                id: boot_bar
                x: 8
                y: 60
                width: 112
                height: 3
                min_value: 0
                max_value: 100
                value: 0
                bg_opa: COVER
                bg_color: 0x202020
                indicator:
                  bg_opa: COVER
                  bg_color: 0xFFD000

esphome:
  on_boot:
    - priority: -100.0
      then:
        - script.execute: boot_layout
