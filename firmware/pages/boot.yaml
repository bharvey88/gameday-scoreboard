# Boot and setup screen. Shown over everything until the panel is on WiFi
# and has shown its connect hint for a while; the boot button brings the
# full address back.
#
# Three states, driven by the real WiFi state every half second. Each is a
# title plus up to four lines: small, big, small, small.
#
#   hotspot up     On your phone, join WiFi / Game Day Scoreboard / a setup page will open
#   connecting     Connecting to / <network name>
#   connected      GAME DAY APP / or visit / gameday-2f6a70
#
# A fresh panel keeps that hint up for 45 seconds, or until a team is
# picked. A panel that already has a team flashes it for 3 seconds (or skips
# it when "Show address at boot" is off on the device page). Either way, a
# boot button hold shows the full address instead: On your phone, open /
# gameday.local / or 10.10.10.97 / then pick your team.
#
# Two more states, event-driven off esp32_improv (Bluetooth setup) instead of
# the WiFi poll, since that's how the Game Day app actually provisions a
# panel: SETUP / open the / Game Day app while advertising, JOINING / Wi-Fi
# once the app hands over credentials. See the esp32_improv block below.

globals:
  - id: boot_ip_shown_ms
    type: uint32_t
    initial_value: '0'
  - id: boot_bar_value
    type: int
    initial_value: '0'
  - id: boot_button_press_ms
    type: uint32_t
    initial_value: '0'
  - id: boot_hold_stage
    type: int
    initial_value: '0'

script:
  # Positions and fonts for the current panel width
  - id: boot_layout
    then:
      - lambda: |-
          const int W = lv_disp_get_hor_res(lv_disp_get_default());
          const bool wide = W >= 128;
          lv_obj_t *lines[4] = {id(boot_la), id(boot_lb), id(boot_lc), id(boot_ld)};
          for (auto *l : lines) {
            lv_obj_set_width(l, W - 4);
            lv_obj_set_x(l, 2);
          }
          lv_obj_set_width(id(boot_title), W);
          lv_obj_set_width(id(boot_rule), W - 8);
          lv_obj_set_width(id(boot_bar), W - 16);
          lv_obj_set_pos(id(boot_bar), 8, wide ? 60 : 59);
          if (wide) {
            lv_obj_set_style_text_font(id(boot_title), id(spleen_16), 0);
            lv_obj_set_pos(id(boot_title), 0, 2);
            lv_obj_set_pos(id(boot_rule), 4, 19);
            lv_obj_set_style_text_font(id(boot_lb), id(spleen_12), 0);
            lv_obj_set_y(id(boot_la), 22);
            lv_obj_set_y(id(boot_lb), 31);
            lv_obj_set_y(id(boot_lc), 44);
            lv_obj_set_y(id(boot_ld), 53);
          } else {
            lv_obj_set_style_text_font(id(boot_title), id(spleen_12), 0);
            lv_obj_set_pos(id(boot_title), 0, 1);
            lv_obj_set_pos(id(boot_rule), 4, 14);
            lv_obj_set_style_text_font(id(boot_lb), id(spleen_8), 0);
            lv_obj_set_y(id(boot_la), 16);
            lv_obj_set_y(id(boot_lb), 26);
            lv_obj_set_y(id(boot_lc), 36);
            lv_obj_set_y(id(boot_ld), 46);
          }

  # Write the four lines. A line wider than the panel scrolls.
  - id: boot_set_lines
    parameters:
      la: string
      lb: string
      lc: string
      ld: string
      busy: bool
    then:
      - lambda: |-
          auto put = [](lv_obj_t *l, const std::string &t) {
            const char *cur = lv_label_get_text(l);
            if (cur == nullptr || t != cur)
              lv_label_set_text(l, t.c_str());
          };
          put(id(boot_la), la);
          put(id(boot_lb), lb);
          put(id(boot_lc), lc);
          put(id(boot_ld), ld);
          if (busy) lv_obj_clear_flag(id(boot_bar), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(boot_bar), LV_OBJ_FLAG_HIDDEN);

  - id: boot_refresh
    parameters:
      via_button: bool
    then:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (w == nullptr) return;
          if (w->is_connected()) {
            const bool wide = lv_disp_get_hor_res(lv_disp_get_default()) >= 128;
            if (via_button) {
              // Boot button hold: always the full address, never the app hint.
              std::string ip;
              for (auto &a : w->wifi_sta_ip_addresses()) {
                if (a.is_set() && a.is_ip4()) {
                  char buf[48];
                  a.str_to(buf);
                  ip = buf;
                  break;
                }
              }
              // A single panel is 12 characters wide: terse lines, only the hostname scrolls.
              if (wide)
                id(boot_set_lines).execute("On your phone, open", id(gameday_ctl).hostname() + ".local", "or " + ip, "then pick your team", false);
              else
                id(boot_set_lines).execute("Open", id(gameday_ctl).hostname() + ".local", ip, "pick a team", false);
            } else {
              // Normal connect: point at the Game Day app first, the
              // hostname is only a fallback for typing the address by hand.
              if (wide)
                id(boot_set_lines).execute("GAME DAY APP", "or visit", id(gameday_ctl).hostname() + ".local", "", false);
              else
                id(boot_set_lines).execute("GAME DAY", "APP", id(gameday_ctl).hostname() + ".local", "", false);
            }
            if (id(boot_ip_shown_ms) == 0) {
              id(boot_ip_shown_ms) = millis() == 0 ? 1 : millis();
              if (!id(gameday_ctl).setup_done())
                id(boot_hide_later).execute(45000);
              else if (id(gameday_ctl).show_boot_address())
                id(boot_hide_later).execute(3000);
              else
                id(boot_hide).execute();
            }
          } else if (!w->has_sta() || w->is_ap_active()) {
            const bool wide = lv_disp_get_hor_res(lv_disp_get_default()) >= 128;
            if (wide)
              id(boot_set_lines).execute("On your phone, join WiFi", "Game Day Scoreboard", "a setup page will open", "", true);
            else
              id(boot_set_lines).execute("Join WiFi", "Game Day", "Scoreboard", "", true);
          } else {
            const bool wide = lv_disp_get_hor_res(lv_disp_get_default()) >= 128;
            char ssid[wifi::SSID_BUFFER_SIZE];
            id(boot_set_lines).execute(wide ? "Connecting to" : "Connecting", w->wifi_ssid_to(ssid), "", "", true);
          }

  # Keep the address up for a while after connecting, then clear the overlay
  - id: boot_hide_later
    mode: restart
    parameters:
      ms: int
    then:
      - delay: !lambda 'return ms;'
      - script.execute: boot_hide

  - id: boot_hide
    then:
      - component.suspend: boot_check
      - component.suspend: boot_anim
      - lvgl.obj.update:
          id: boot_overlay
          hidden: true

  # Boot button: bring the address back for 20 seconds
  - id: boot_show_address
    mode: restart
    then:
      - script.execute:
          id: boot_refresh
          via_button: true
      - lvgl.obj.update:
          id: boot_overlay
          hidden: false
      - delay: 20s
      - script.execute: boot_hide

  # Boot button held down: stage 1 shows the address, stage 2 warns that a
  # reset is coming with a bar that fills from 5s to 10s, stage 3 resets.
  # Timed from the press so the customer sees the warning before anything
  # is erased.
  - id: boot_hold_tick
    then:
      - lambda: |-
          if (id(boot_button_press_ms) == 0) return;
          const uint32_t held = millis() - id(boot_button_press_ms);
          if (held >= 10000) {
            if (id(boot_hold_stage) == 3) return;
            id(boot_hold_stage) = 3;
            id(boot_set_lines).execute("Wi-Fi reset", "restarting", "", "", false);
            id(boot_button_press_ms) = 0;
            id(reset_wifi).press();
            return;
          }
          if (held >= 5000) {
            if (id(boot_hold_stage) != 2) {
              id(boot_hold_stage) = 2;
              // component.suspend maps to stop_poller() on a PollingComponent;
              // there is no suspend() method to call from a lambda.
              id(boot_anim).stop_poller();
              // boot_check repaints the overlay twice a second. On a panel
              // whose overlay is still up (first boot, or the 45s setup hint)
              // it would overwrite this warning as fast as we draw it. It is
              // not resumed on release: boot_show_address ends in boot_hide,
              // which suspends it anyway, so this is where it would land.
              id(boot_check).stop_poller();
              id(boot_set_lines).execute("Keep holding", "to reset", "Wi-Fi", "", true);
            }
            int pct = (int) ((held - 5000) / 50);  // 5000ms span -> 0..100
            if (pct > 100) pct = 100;
            lv_bar_set_value(id(boot_bar), pct, LV_ANIM_OFF);
            return;
          }
          if (held >= 1500 && id(boot_hold_stage) < 1) {
            id(boot_hold_stage) = 1;
            id(boot_show_address).execute();
          }

interval:
  - interval: 500ms
    startup_delay: 500ms
    id: boot_check
    then:
      - script.execute:
          id: boot_refresh
          via_button: false
  - interval: 60ms
    id: boot_anim
    then:
      - lambda: |-
          id(boot_bar_value) = (id(boot_bar_value) + 3) % 130;
          int v = id(boot_bar_value) > 100 ? 100 : id(boot_bar_value);
          lv_bar_set_value(id(boot_bar), v, LV_ANIM_OFF);
  - interval: 100ms
    id: boot_hold_check
    then:
      - script.execute: boot_hold_tick

# Bluetooth setup (esp32_improv, configured in gameday-common.yaml) starts
# advertising about a second after a boot with no saved network, and the
# Game Day app finds the panel over Bluetooth rather than someone joining the
# AP hotspot by hand. Say so on the overlay instead of leaving it on
# "Connecting" (or blank, before boot_check's first 500ms tick) while it
# waits. boot_check keeps polling the whole time, so once WiFi actually
# connects it overwrites these lines with the normal app-hint/Ready flow on
# its own; on_stop needs no action here for that reason.
esp32_improv:
  on_start:
    # The overlay may already be hidden and boot_check/boot_anim suspended
    # (a panel that already had a team, or a fallback AP coming up mid-run
    # without a reboot) - undo boot_hide and cancel any pending boot_hide_later
    # so setup text isn't hidden out from under itself.
    - component.resume: boot_check
    - component.resume: boot_anim
    - script.stop: boot_hide_later
    - lvgl.obj.update:
        id: boot_overlay
        hidden: false
    - lambda: |-
        const bool wide = lv_disp_get_hor_res(lv_disp_get_default()) >= 128;
        if (wide)
          id(boot_set_lines).execute("SETUP", "open the", "Game Day app", "", true);
        else
          id(boot_set_lines).execute("SETUP", "Game Day", "app", "", true);
  on_provisioning:
    - lambda: 'id(boot_set_lines).execute("JOINING", "Wi-Fi", "", "", true);'
  on_provisioned:
    # Credentials worked; nudge boot_check's 500ms poll now instead of
    # waiting up to half a second for it to notice and repaint the
    # app-hint/Ready lines itself.
    - script.execute:
        id: boot_refresh
        via_button: false

# Boot button: the hold is timed from the press so the panel can warn before
# it erases anything. 1.5s shows the address, 5s starts the "keep holding"
# warning with a filling bar, 10s resets Wi-Fi. Releasing before 10s leaves
# the address up for 20s as before and resets nothing.
binary_sensor:
  - id: !extend power_button
    on_press:
      - lambda: |-
          id(boot_button_press_ms) = millis() == 0 ? 1 : millis();
          id(boot_hold_stage) = 0;
    on_release:
      - lambda: |-
          const bool warned = id(boot_hold_stage) == 2;
          id(boot_button_press_ms) = 0;
          id(boot_hold_stage) = 0;
          if (warned) {
            // Back out of the warning: restore the address screen and its bar.
            id(boot_anim).start_poller();
            id(boot_show_address).execute();
          }

lvgl:
  style_definitions:
    - id: boot_st_title
      text_font: spleen_16
      text_color: 0xFFD000
    - id: boot_st_big
      text_color: 0xFFFFFF
    - id: boot_st_small
      text_color: 0xB0B8C4
  top_layer:
    widgets:
      - obj:
          id: boot_overlay
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_opa: COVER
          bg_color: 0x000000
          radius: 0
          pad_all: 0
          border_width: 0
          hidden: false
          widgets:
            - label:
                id: boot_title
                x: 0
                y: 2
                width: 128
                text_align: CENTER
                text: "GAME DAY"
                styles: [boot_st_title]
            - obj:
                id: boot_rule
                x: 4
                y: 19
                width: 120
                height: 1
                bg_opa: COVER
                bg_color: 0xFFD000
            - label:
                id: boot_la
                x: 2
                y: 22
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: "Starting"
                styles: [boot_st_small]
            - label:
                id: boot_lb
                x: 2
                y: 31
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: ""
                styles: [boot_st_big]
            - label:
                id: boot_lc
                x: 2
                y: 44
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: ""
                styles: [boot_st_small]
            - label:
                id: boot_ld
                x: 2
                y: 53
                width: 124
                text_align: CENTER
                long_mode: SCROLL_CIRCULAR
                text: ""
                styles: [boot_st_small]
            - bar:
                id: boot_bar
                x: 8
                y: 60
                width: 112
                height: 3
                min_value: 0
                max_value: 100
                value: 0
                bg_opa: COVER
                bg_color: 0x202020
                indicator:
                  bg_opa: COVER
                  bg_color: 0xFFD000

esphome:
  on_boot:
    - priority: -100.0
      then:
        - script.execute: boot_layout
