# Game Day Scoreboard, shared configuration.
# Do not build this file directly: build gameday.yaml, which includes it.

substitutions:
  # The MAC suffix keeps two panels on one network apart: gameday-2f6a70.local
  name: "gameday"
  friendly_name: "Game Day Scoreboard"
  version: "1.1.0"
  variant: "m1"

  display_panel_width: "64"
  display_panel_height: "64"
  display_layout: HORIZONTAL
  display_layout_rows: "1"
  # The widest chain this firmware supports. The count actually driven comes
  # from the saved "Panels" choice (default 1), applied by panel_layout at boot.
  display_layout_cols: "2"
  display_scan_wiring: STANDARD_TWO_SCAN

  # hub75-studio packages (controller, theme, clock page). Pinned to a commit
  # so a release always builds the same thing.
  hub75_studio_ref: "2c121972321cc1e3c2c87d9647fd3beb9a5e2271"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  comment: "v${version}"
  build_path: build/gameday-${variant}
  project:
    name: bharvey88.gameday-scoreboard
    version: "${version}"
  on_boot:
    # The Power switch and Brightness number restore their saved state before
    # the HUB75 driver exists (template entities set up at priority ~800, the
    # display at 400), and the driver starts at its config default. Apply the
    # restored values once the display is up, or a panel saved as off boots
    # lit and the page shows it off.
    - priority: 300.0
      then:
        - hub75.set_brightness:
            id: matrix
            brightness: !lambda 'return id(power).state ? (uint8_t) id(brightness).state : 0;'

external_components:
  - source:
      type: local
      path: ../components
    components: [gameday, panel_layout]
  - source: github://pavlov-net/lvgl-page-manager@v0.3.0
    components: [lvgl_page_manager]
  # Fireworks behind the touchdown and win splashes
  - source: github://pavlov-net/lvgl-canvas-fx@v0.4.1
    components: [lvgl_canvas_fx]

packages:
  hub75_studio:
    url: https://github.com/pavlov-net/hub75-studio
    ref: "${hub75_studio_ref}"
    refresh: 1d
    files:
      - path: packages/common/esphome-version.yaml
      - path: packages/controllers/apollo-automation-m1-rev6.yaml
        vars:
          panel_width: ${display_panel_width}
          panel_height: ${display_panel_height}
          layout: ${display_layout}
          layout_rows: ${display_layout_rows}
          layout_cols: ${display_layout_cols}
          scan_wiring: ${display_scan_wiring}
      - path: packages/common/theme.yaml
      - path: packages/pages/clock.yaml
        vars:
          page_friendly_name: "Clock"
  boot: !include pages/boot.yaml
  scoreboard: !include pages/gameday-live.yaml
  wizmote: !include pages/wizmote.yaml

# Panel count from the saved preference, applied before the display starts.
panel_layout:
  id: gd_panels
  display_id: matrix
  default_cols: 1
  max_cols: 2

logger:
  baud_rate: 115200

# No Home Assistant required: never reboot for lack of an API client.
api:
  reboot_timeout: 0s

ota:
  - platform: esphome
  - platform: http_request
    id: gd_ota_http

wifi:
  power_save_mode: none
  ap:
    ssid: "Game Day Scoreboard"

captive_portal:

improv_serial:

web_server:
  version: 3
  # Custom page (firmware/web). Regenerate bundle.js with scripts/build_web.py.
  js_include: web/bundle.js
  css_include: web/app.css

http_request:
  id: http_client
  timeout: 20s
  watchdog_timeout: 30s
  # ESPN, its logo CDN and GitHub Pages all use Let's Encrypt, which is in the
  # ESP-IDF certificate bundle, so every fetch (including firmware) is verified.
  verify_ssl: true
  buffer_size_rx: 2048

# Over-the-air updates from the release manifest. Checked every 6 hours and
# on demand from the device page. (Releases before v0.6.0 polled 64x64/ and
# 128x64/ manifests; the workflow still publishes copies there.)
update:
  - platform: http_request
    id: gd_firmware_update
    name: "Firmware"
    source: https://bharvey88.github.io/gameday-scoreboard/firmware/${variant}/manifest.json
    update_interval: 6h

time:
  - platform: sntp
    id: ha_time  # the clock page extends this id
    on_time_sync:
      # The update component checks the manifest as soon as WiFi is up, which
      # is before the clock is set; with verify_ssl that first check fails and
      # the state reads "unknown" for six hours. Check once more after the
      # first sync.
      - if:
          condition:
            lambda: 'return !id(gd_update_checked);'
          then:
            - lambda: 'id(gd_update_checked) = true;'
            - delay: 3s
            - lambda: 'id(gd_firmware_update).update();'
    # Overridden at boot by the saved Timezone choice. Present so ESPHome
    # 2026.9+ compiles its timezone support at all (posix_tz.cpp is only
    # built when a timezone is configured).
    timezone: "CST6CDT,M3.2.0,M11.1.0"

# Team logos, decoded on the device from ESPN's dark-background PNGs.
image:
  - platform: online_image
    id: gd_team_logo
    url: https://a.espncdn.com/i/teamlogos/nfl/500-dark/dal.png
    type: RGB565
    format: PNG
    resize: 32x32
    transparency: alpha_channel
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: gd_team_logo_img
          src: gd_team_logo
    on_error:
      - logger.log: "Team logo download failed"
  - platform: online_image
    id: gd_opp_logo
    url: https://a.espncdn.com/i/teamlogos/nfl/500-dark/phi.png
    type: RGB565
    format: PNG
    resize: 32x32
    transparency: alpha_channel
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: gd_opp_logo_img
          src: gd_opp_logo
    on_error:
      - logger.log: "Opponent logo download failed"

globals:
  - id: gd_update_checked
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: gd_last_team_logo
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: gd_last_opp_logo
    type: std::string
    restore_value: no
    initial_value: '""'

# The device page talks to /gameday/state, /gameday/set and /gameday/action
# (components/gameday). Only the entities worth having in Home Assistant stay.
gameday:
  id: gameday_ctl
  http_request_id: http_client
  time_id: ha_time
  panel_layout_id: gd_panels
  on_action:
    - if:
        condition:
          lambda: 'return x == "team_picked";'
        then:
          - script.execute: boot_hide
  on_update:
    - text_sensor.template.publish:
        id: gd_status_sensor
        state: !lambda 'return x.status_text;'
    - text_sensor.template.publish:
        id: gd_last_play_sensor
        state: !lambda 'return x.last_play;'
    - script.execute:
        id: gd_update
        game_state: !lambda 'return x.game_state;'
        team_abbr: !lambda 'return x.team_abbr;'
        team_score: !lambda 'return x.team_score;'
        opponent_abbr: !lambda 'return x.opponent_abbr;'
        opponent_score: !lambda 'return x.opponent_score;'
        status_text: !lambda 'return x.status_text;'
        clock_text: !lambda 'return x.clock_text;'
        down_distance: !lambda 'return x.down_distance;'
        is_red_zone: !lambda 'return x.is_red_zone;'
        team_color: !lambda 'return (int) x.team_color;'
        opponent_color: !lambda 'return (int) x.opponent_color;'
        possession: !lambda 'return x.possession;'
        team_timeouts: !lambda 'return x.team_timeouts;'
        opponent_timeouts: !lambda 'return x.opponent_timeouts;'
        team_record: !lambda 'return x.team_record;'
        opponent_record: !lambda 'return x.opponent_record;'
        splash_text: !lambda 'return x.splash_text;'
        splash_color: !lambda 'return (int) x.splash_color;'
    - if:
        condition:
          lambda: 'return !x.team_logo.empty() && x.team_logo != id(gd_last_team_logo);'
        then:
          - lambda: 'id(gd_last_team_logo) = x.team_logo;'
          - online_image.set_url:
              id: gd_team_logo
              url: !lambda 'return x.team_logo;'
              update: true
    - if:
        condition:
          lambda: 'return x.opponent_logo.empty();'
        then:
          - lambda: 'id(gd_last_opp_logo) = "";'
    - if:
        condition:
          lambda: 'return !x.opponent_logo.empty() && x.opponent_logo != id(gd_last_opp_logo);'
        then:
          - lambda: 'id(gd_last_opp_logo) = x.opponent_logo;'
          - online_image.set_url:
              id: gd_opp_logo
              url: !lambda 'return x.opponent_logo;'
              update: true

lvgl_page_manager:
  sort: by_order
  default_page: gameday_live
  select:
    name: "Select Page"
    icon: "mdi:book-open-page-variant"
  next_button:
    name: "Page Next"
    icon: "mdi:page-next"
  prev_button:
    name: "Page Previous"
    icon: "mdi:page-previous"

select:
  - platform: gameday
    gameday_id: gameday_ctl
    type: team
    name: "Team"
    icon: "mdi:football"
  - platform: gameday
    gameday_id: gameday_ctl
    type: mode
    name: "Mode"
    icon: "mdi:shuffle-variant"

switch:
  - platform: template
    name: "Power"
    id: power
    icon: "mdi:power"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - hub75.set_brightness:
          id: matrix
          brightness: !lambda return id(brightness).state;
    turn_off_action:
      - hub75.set_brightness:
          id: matrix
          brightness: 0
number:
  - platform: template
    name: "Brightness"
    id: brightness
    icon: "mdi:brightness-6"
    min_value: 1
    max_value: 255
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 128
    on_value:
      then:
        - if:
            condition:
              switch.is_on: power
            then:
              - hub75.set_brightness:
                  id: matrix
                  brightness: !lambda return x;
  - platform: template
    name: "Scroll Speed"
    id: shared_scroll_speed
    icon: "mdi:speedometer"
    min_value: 1
    max_value: 10
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 5
    entity_category: config

button:
  - platform: template
    name: "Check for Updates"
    id: gd_check_update
    icon: "mdi:update"
    entity_category: config
    on_press:
      - lambda: 'id(gd_firmware_update).update();'
  - platform: template
    name: "Refresh Now"
    id: gd_refresh
    icon: "mdi:refresh"
    on_press:
      - lambda: 'id(gameday_ctl).refresh_now();'
  - platform: restart
    icon: mdi:power-cycle
    name: "Reboot"
    entity_category: "diagnostic"

text_sensor:
  - platform: template
    name: "Game Status"
    id: gd_status_sensor
    icon: "mdi:scoreboard"
  - platform: template
    name: "Last Play"
    id: gd_last_play_sensor
    icon: "mdi:football-helmet"
  - platform: wifi_info
    ip_address:
      name: "IP"
      icon: "mdi:ip-outline"
      entity_category: "diagnostic"

sensor:
  - platform: template
    name: "Free Heap (PSRAM)"
    device_class: data_size
    state_class: measurement
    entity_category: diagnostic
    unit_of_measurement: "KiB"
    update_interval: 30s
    lambda: |-
      #include "esp_heap_caps.h"
      return (float) heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024;
    disabled_by_default: true
  - platform: wifi_signal
    name: RSSI
    update_interval: 60s
    entity_category: "diagnostic"
    disabled_by_default: true
