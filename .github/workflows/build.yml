name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [64x64, 128x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        id: esphome
        uses: esphome/build-action@v7
        with:
          yaml-file: firmware/gameday-${{ matrix.variant }}.yaml
          version: "2026.8.1"
          complete-manifest: true
          release-summary: ${{ github.ref_name }}
          release-url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
      - name: Stage output under a stable folder name
        run: |
          mkdir -p out
          cp -r "${{ steps.esphome.outputs.name }}" "out/${{ matrix.variant }}"
          ls -R out
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: out

  host-tests:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests

  publish:
    name: Publish flasher and release
    needs: [build, host-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts
          merge-multiple: true
      - name: Assemble site
        run: |
          mkdir -p site/firmware
          cp -r docs/site/* site/
          cp -r artifacts/* site/firmware/
          sed -i "s/__VERSION__/${GITHUB_REF_NAME}/g" site/index.html
          ls -R site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          for v in 64x64 128x64; do
            f=$(ls artifacts/$v/*.factory.bin | head -1)
            cp "$f" "release/gameday-scoreboard-$v-${GITHUB_REF_NAME}.factory.bin"
          done
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
