name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notes:
    # Release notes come from CHANGELOG.md. On a tag the section must exist.
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.notes.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - id: notes
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python scripts/release_notes.py "${GITHUB_REF_NAME}" > notes.md
            echo "summary=$(python scripts/release_notes.py "${GITHUB_REF_NAME}" --summary)" >> "$GITHUB_OUTPUT"
          else
            echo "Development build" > notes.md
            echo "summary=Development build" >> "$GITHUB_OUTPUT"
          fi
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  build:
    # One firmware for every panel count since v0.6.0; the "m1" name is the
    # manifest folder on the flasher site.
    name: Build m1
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        id: esphome
        uses: esphome/build-action@v7
        with:
          yaml-file: firmware/gameday.yaml
          version: "2026.8.2"
          complete-manifest: true
          release-summary: ${{ needs.notes.outputs.summary }}
          release-url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
      - name: Stage output under a stable folder name
        run: |
          mkdir -p out
          cp -r "${{ steps.esphome.outputs.name }}" out/m1
          ls -R out
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-m1
          path: out

  build-beta:
    # Early warning: the next ESPHome, allowed to fail. Nothing is published
    # from this job.
    name: Build m1 (ESPHome beta)
    needs: notes
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: esphome/build-action@v7
        with:
          yaml-file: firmware/gameday.yaml
          version: beta

  host-tests:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests

  publish:
    name: Publish flasher and release
    needs: [build, host-tests, notes]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Assemble site
        run: |
          mkdir -p site/firmware
          cp -r docs/site/* site/
          cp -r artifacts/* site/firmware/
          # Panels flashed before v0.6.0 poll these two manifests for updates.
          cp -r site/firmware/m1 site/firmware/64x64
          cp -r site/firmware/m1 site/firmware/128x64
          sed -i "s/__VERSION__/${GITHUB_REF_NAME}/g" site/index.html
          ls -R site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Create the release with notes and binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          f=$(ls artifacts/m1/*.factory.bin | head -1)
          cp "$f" "release/gameday-scoreboard-${GITHUB_REF_NAME}.factory.bin"
          PREV=$(gh release list --exclude-drafts --limit 20 --json tagName --jq "[.[].tagName | select(. != \"${GITHUB_REF_NAME}\")][0]")
          {
            cat notes/notes.md
            echo
            echo "Install or update from the [flasher page](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/), or let a panel already running v0.2.2 or later update itself from its device page."
            if [ -n "$PREV" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } > release/body.md
          gh release create "$GITHUB_REF_NAME" release/*.bin --title "$GITHUB_REF_NAME" --notes-file release/body.md || \
          { gh release upload "$GITHUB_REF_NAME" release/*.bin --clobber; gh release edit "$GITHUB_REF_NAME" --notes-file release/body.md; }
