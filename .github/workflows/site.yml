name: Site

# Republish gamedayscoreboard.app when only docs/site changed, without a
# firmware release. The firmware files come from the Build run of the latest
# release tag, so panels see the same manifest and binaries they saw before.

on:
  push:
    branches: [main]
    paths: ["docs/site/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish site only
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site from docs/site and the latest release's firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch "$TAG" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "release $TAG, build run $RUN"
          mkdir -p site/firmware
          cp -r docs/site/. site/
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n firmware-moonhub75 -D site/firmware
          test -f site/firmware/moonhub75/manifest.json
          sed -i "s/__VERSION__/${TAG}/g" site/index.html
          ls -laR site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        env:
          # Pages keys deployments by this value. Two workflows deploying the
          # same commit (a docs push, then its tag) must not collide.
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}
